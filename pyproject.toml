[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "snto"
# Alpine Edition versioning restarts from 0.x: this is a new, unreleased,
# field-unvalidated product line. It does NOT inherit the base observatory's
# v1.0→v2.0 release lineage. Drop the .dev0 marker when the first release is cut.
version = "0.1.0.dev0"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
# Alembic autogenerates these from the models; they are not hand-written and
# re-running --autogenerate would just regenerate the same style anyway.
extend-exclude = ["src/persistence/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
