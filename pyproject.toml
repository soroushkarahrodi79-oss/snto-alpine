[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "snto"
# Alpine Edition versioning restarts from 0.x: new product line, does NOT inherit
# the base observatory's v1.0→v2.0 release lineage. Field campaign (#11) not yet
# executed — this is a reproducible prototype release, not a validated product.
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
# Alembic autogenerates these from the models; they are not hand-written and
# re-running --autogenerate would just regenerate the same style anyway.
extend-exclude = ["src/persistence/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
